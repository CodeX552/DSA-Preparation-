<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Climbing Stairs DP Animation</title>
  <desc id="desc">Highlights dp states building from left to right.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .step { fill: #cfd8dc; rx: 8; }
      .active { fill: #26a69a; }
      .txt { font: 15px 'Segoe UI', sans-serif; fill: #1f2937; }
      .val { font: 13px 'Consolas', monospace; fill: #111827; }
      .pulse { animation: pulse 3s infinite; }
      #s1 { animation-delay: 0s; }
      #s2 { animation-delay: .5s; }
      #s3 { animation-delay: 1s; }
      #s4 { animation-delay: 1.5s; }
      #s5 { animation-delay: 2s; }
      @keyframes pulse {
        0%, 15% { fill: #26a69a; }
        30%, 100% { fill: #cfd8dc; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="220"/>
  <text class="txt" x="22" y="30">Climbing Stairs: dp[i] = dp[i-1] + dp[i-2]</text>

  <rect class="step pulse" id="s1" x="60" y="150" width="90" height="40"/>
  <rect class="step pulse" id="s2" x="170" y="130" width="90" height="60"/>
  <rect class="step pulse" id="s3" x="280" y="110" width="90" height="80"/>
  <rect class="step pulse" id="s4" x="390" y="90" width="90" height="100"/>
  <rect class="step pulse" id="s5" x="500" y="70" width="90" height="120"/>

  <text class="val" x="85" y="173">dp[1]=1</text>
  <text class="val" x="195" y="163">dp[2]=2</text>
  <text class="val" x="305" y="153">dp[3]=3</text>
  <text class="val" x="415" y="143">dp[4]=5</text>
  <text class="val" x="525" y="133">dp[5]=8</text>
</svg>
